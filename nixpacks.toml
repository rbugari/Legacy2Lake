providers = ["python"]

[variables]
PYTHON_VERSION = "3.10"

[phases.setup]
aptPkgs = [
    "libnss3", 
    "libnspr4", 
    "libatk1.0-0", 
    "libatk-bridge2.0-0", 
    "libcups2", 
    "libdrm2", 
    "libdbus-1-3", 
    "libxkbcommon0", 
    "libxcomposite1", 
    "libxdamage1", 
    "libxext6", 
    "libxfixes3", 
    "librandr2", 
    "libgbm1", 
    "libpango-1.0-0", 
    "libcairo2", 
    "libasound2",
    "python3-pip"
]

[phases.build]
cmds = [
    "python3 -m pip install -r requirements.txt", 
    "python3 -m playwright install chromium"
]
